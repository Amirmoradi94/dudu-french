# Exemple de bloc nginx devant l'application (HTTPS par certbot), à déposer sur le serveur dans
#   /etc/nginx/conf.d/french.example.com.conf    (remplacez french.example.com par votre domaine)
#
# Mise en place, une seule fois, sur le serveur :
#   sudo cp nginx-example.conf /etc/nginx/conf.d/french.example.com.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d french.example.com
# certbot ajoutera lui-même le bloc 443 et la redirection HTTP → HTTPS.
# (Il faut qu'un enregistrement DNS A french.example.com → l'IP du serveur existe.)

server {
    listen 80;
    listen [::]:80;
    server_name french.example.com;

    # Les mp3 font quelques mégaoctets : pas de tampon disque inutile.
    proxy_buffering off;

    # Le tuteur peut mettre plusieurs dizaines de secondes à répondre.
    proxy_connect_timeout 10s;
    proxy_send_timeout   180s;
    proxy_read_timeout   180s;

    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Le mot de passe est vérifié par Caddy derrière : on laisse passer l'en-tête.
        proxy_pass_header Authorization;
    }
}
